name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build solution
        run: dotnet build ProjectSync.sln --configuration Release
      - name: Validate PowerShell syntax
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          $script = (Resolve-Path src/ProjectSync.Core/Scripts/BuildSync.ps1).Path
          [void][System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw ($errors -join [Environment]::NewLine) }
      - name: Package and verify Windows release
        shell: pwsh
        run: |
          $app = 'src/ProjectSync.App/ProjectSync.App.csproj'
          [xml]$project = Get-Content -LiteralPath $app -Raw
          $version = [string]$project.Project.PropertyGroup.Version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match application version v$version."
          }
          dotnet publish $app --configuration Release --runtime win-x64 --self-contained false --output package/ProjectSync
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path dist | Out-Null
          Compress-Archive -LiteralPath package/ProjectSync -DestinationPath dist/ProjectSync-win-x64.zip
          Expand-Archive -LiteralPath dist/ProjectSync-win-x64.zip -DestinationPath verified
          $root = @(Get-ChildItem -LiteralPath verified -Force)
          if ($root.Count -ne 1 -or $root[0].Name -ne 'ProjectSync' -or !$root[0].PSIsContainer) {
            throw 'Unexpected ZIP root.'
          }
          $folder = $root[0].FullName
          foreach ($file in 'ProjectSync.App.exe', 'ProjectSync.App.dll', 'ProjectSync.App.runtimeconfig.json', 'ProjectSync.Core.dll', 'BuildSync.ps1') {
            if (!(Test-Path -LiteralPath (Join-Path $folder $file) -PathType Leaf)) { throw "Missing $file." }
          }
          if (@(Get-ChildItem -LiteralPath $folder -Directory -Force).Count -ne 0 -or
              @(Get-ChildItem -LiteralPath $folder -Filter '*.exe' -File).Count -ne 1) {
            throw 'Unexpected nested directory or extra executable.'
          }
          $assembly = [Reflection.AssemblyName]::GetAssemblyName((Join-Path $folder 'ProjectSync.App.dll'))
          if ($assembly.Version.ToString(3) -cne $version) { throw 'Packaged assembly version does not match project.' }
      - uses: actions/upload-artifact@v4
        with:
          name: ProjectSync-win-x64
          path: dist/ProjectSync-win-x64.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ProjectSync-win-x64
      - name: Publish and verify GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" ProjectSync-win-x64.zip --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TAG" --generate-notes
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets,isDraft,url --jq 'select(.isDraft == false and any(.assets[]; .name == "ProjectSync-win-x64.zip")) | .url' > release-url.txt
          test -s release-url.txt
          cat release-url.txt >> "$GITHUB_STEP_SUMMARY"
