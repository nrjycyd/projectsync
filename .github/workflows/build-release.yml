name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build solution
        run: dotnet build ProjectSync.sln --configuration Release
      - name: Validate PowerShell syntax
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          $script = (Resolve-Path src/ProjectSync.Core/Scripts/BuildSync.ps1).Path
          [void][System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw ($errors -join [Environment]::NewLine) }
      - name: Package and verify Windows release
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME }
          ./tools/Publish-Windows.ps1 -OutputDirectory dist -ExpectedTag $tag
      - uses: actions/upload-artifact@v4
        with:
          name: ProjectSync-win-x64
          path: dist/ProjectSync-v*-win-x64.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ProjectSync-win-x64
      - name: Publish and verify GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          asset="ProjectSync-$RELEASE_TAG-win-x64.zip"
          gh release create "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TAG" --generate-notes
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets,isDraft,url |
            jq -er --arg asset "$asset" 'select(.isDraft == false and any(.assets[]; .name == $asset)) | .url' >> "$GITHUB_STEP_SUMMARY"
